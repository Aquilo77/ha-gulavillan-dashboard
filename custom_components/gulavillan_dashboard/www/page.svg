      <line x1="1435" y1="422" x2="1435" y2="518" stroke="#f7f3ea" stroke-width="6"/>
      <line x1="1372" y1="470" x2="1498" y2="470" stroke="#f7f3ea" stroke-width="6"/>
    </g>

    <g data-entity="light.vardagsrum" data-action="toggle">
      <rect x="900" y="700" width="170" height="150" fill="#f7f3ea"/>
      <rect x="912" y="712" width="146" height="126" fill="#334155" data-entity="light.vardagsrum" data-widget="state-fill" data-on="#f8e7a8" data-off="#243044"/>
      <line x1="985" y1="712" x2="985" y2="838" stroke="#f7f3ea" stroke-width="6"/>
      <line x1="912" y1="775" x2="1058" y2="775" stroke="#f7f3ea" stroke-width="6"/>
    </g>
    <g data-entity="light.kok" data-action="toggle">
      <rect x="1380" y="700" width="170" height="150" fill="#f7f3ea"/>
      <rect x="1392" y="712" width="146" height="126" fill="#334155" data-entity="light.kok" data-widget="state-fill" data-on="#f8e7a8" data-off="#243044"/>
      <line x1="1465" y1="712" x2="1465" y2="838" stroke="#f7f3ea" stroke-width="6"/>
      <line x1="1392" y1="775" x2="1538" y2="775" stroke="#f7f3ea" stroke-width="6"/>
    </g>

    <g data-entity="binary_sensor.ytterdorr">
      <rect x="1168" y="690" width="150" height="260" fill="#f3e2b0"/>
      <g data-entity="binary_sensor.ytterdorr" data-widget="visible-off">
        <rect x="1184" y="706" width="118" height="244" fill="#6b422c"/>
