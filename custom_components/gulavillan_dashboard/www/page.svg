<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243044"/>
      <stop offset="1" stop-color="#10151c"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="1200" cy="1040" rx="780" ry="70" fill="#1c3a2a"/>
  <rect x="1088" y="980" width="150" height="70" fill="#c4b49a"/>

  <text x="80" y="110" fill="#e0b15a" font-size="26" font-family="system-ui, sans-serif" letter-spacing="6">GULAVILLAN</text>
  <text x="80" y="230" fill="#f6f1e7" font-size="112" font-family="system-ui, sans-serif" data-widget="clock">--:--</text>
  <text x="84" y="286" fill="#b7ad9f" font-size="30" font-family="system-ui, sans-serif" data-widget="date"></text>

  <text x="80" y="390" fill="#b7ad9f" font-size="20" font-family="system-ui, sans-serif">UTE</text>
  <text x="80" y="470" fill="#f6f1e7" font-size="72" font-family="system-ui, sans-serif" data-entity="sensor.temperatur_ute" data-widget="value" data-decimals="1">-</text>
  <text x="270" y="470" fill="#b7ad9f" font-size="28" font-family="system-ui, sans-serif" data-entity="sensor.temperatur_ute" data-widget="unit">&#176;C</text>
  <rect x="80" y="500" width="460" height="110" rx="16" fill="#1b2430" data-entity="sensor.temperatur_ute" data-widget="sparkline" data-hours="24"/>

  <text x="80" y="680" fill="#b7ad9f" font-size="20" font-family="system-ui, sans-serif">INOMHUS</text>
  <text x="80" y="752" fill="#f6f1e7" font-size="64" font-family="system-ui, sans-serif" data-entity="climate.vardagsrum" data-attribute="current_temperature" data-widget="value" data-decimals="1">-</text>
  <text x="250" y="752" fill="#b7ad9f" font-size="26" font-family="system-ui, sans-serif">&#176;C</text>
  <text x="80" y="800" fill="#8d8478" font-size="22" font-family="system-ui, sans-serif" data-entity="climate.vardagsrum" data-widget="label">-</text>

  <text x="80" y="880" fill="#b7ad9f" font-size="20" font-family="system-ui, sans-serif">LUFTFUKTIGHET</text>
  <text x="80" y="940" fill="#f6f1e7" font-size="48" font-family="system-ui, sans-serif" data-entity="sensor.luftfuktighet" data-widget="value" data-decimals="0">-</text>
  <text x="180" y="940" fill="#b7ad9f" font-size="24" font-family="system-ui, sans-serif" data-entity="sensor.luftfuktighet" data-widget="unit">%</text>
  <rect x="280" y="910" width="220" height="16" rx="8" fill="#1b2430"/>
  <rect x="280" y="910" width="220" height="16" rx="8" fill="#e0b15a" data-entity="sensor.luftfuktighet" data-widget="bar" data-min="0" data-max="100"/>

