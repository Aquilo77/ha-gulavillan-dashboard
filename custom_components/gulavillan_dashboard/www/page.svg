      <line x1="1015" y1="422" x2="1015" y2="518" stroke="#f7f3ea" stroke-width="6"/>
      <line x1="952" y1="470" x2="1078" y2="470" stroke="#f7f3ea" stroke-width="6"/>
    </g>
    <g data-entity="light.hall" data-action="toggle">
