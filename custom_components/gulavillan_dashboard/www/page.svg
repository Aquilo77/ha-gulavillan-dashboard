    <polygon points="40,150 370,150 205,20" fill="url(#roof)"/>
    <rect x="70" y="150" width="270" height="170" rx="4" fill="#d9c7a4"/>
    <rect x="175" y="210" width="58" height="110" fill="#1b2430"/>
    <rect x="100" y="190" width="52" height="40" fill="#334155" data-entity="light.vardagsrum" data-widget="state-fill" data-on="#f6e7b8" data-off="#334155"/>
    <rect x="258" y="190" width="52" height="40" fill="#334155" data-entity="light.kok" data-widget="state-fill" data-on="#f6e7b8" data-off="#334155"/>
    <circle cx="300" cy="300" r="10" fill="#334155" data-entity="light.hall" data-widget="state-fill" data-on="#e0b15a" data-off="#334155"/>
  </g>
  <text x="1260" y="1020" fill="#b7ad9f" font-size="22" font-family="system-ui, sans-serif">D&#214;RR</text>
  <text x="1360" y="1020" fill="#f6f1e7" font-size="22" font-family="system-ui, sans-serif" data-entity="binary_sensor.ytterdorr" data-widget="label">-</text>
