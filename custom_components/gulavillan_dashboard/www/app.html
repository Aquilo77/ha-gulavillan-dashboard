<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gulavillan</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg-gradient); color: var(--text); font-family: var(--font); font-weight: var(--weight); }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      #app { min-height: 100vh; display: flex; flex-direction: column; }
      #tabs { display: flex; gap: var(--space-xs); overflow-x: auto; justify-content: center; padding: var(--space) var(--space-lg) var(--space-sm); position: sticky; top: 0; z-index: 2; }
      #tabs button { min-height: var(--tab-h); padding: var(--space-sm) var(--space); border-radius: var(--radius-sm); border: var(--line-width) solid transparent; background: transparent; color: var(--tab-idle); white-space: nowrap; font-size: 13px; font-weight: var(--weight-strong); }
      #tabs button[aria-selected="true"] { color: var(--text); background: var(--accent); border-color: var(--accent-border); }
      #view { flex: 1; padding: var(--space-lg); display: flex; flex-direction: column; gap: var(--gap); }
      #view.hem { padding: 0; gap: 0; }
      .hem-layout { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
      .brand { position: absolute; top: var(--space-sm); left: var(--space-xl); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--tab-idle); }
      .clock-float { position: absolute; top: 0; right: var(--space-xl); text-align: right; }
      .clock-float .t { font-size: var(--clock); font-weight: var(--weight-light); letter-spacing: -1px; line-height: 1; }
      .clock-float .d { font-size: 14px; color: var(--muted); }
      .iso-wrap { position: relative; width: min(var(--house-w), 72vw); aspect-ratio: 520 / 420; }
      .iso-wrap svg.house { width: 100%; height: 100%; display: block; }
      .iso-wrap svg [data-action="toggle"] { cursor: pointer; }
      .float-card { position: absolute; background: var(--card); border: var(--line-width) solid var(--line); border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow); min-width: 140px; }
      .float-card .lbl { font-size: 11px; color: var(--muted); margin-bottom: var(--space-xs); text-transform: uppercase; letter-spacing: .08em; }
      .float-card .val { font-size: 26px; font-weight: var(--weight-strong); }
      .float-card .val small { font-size: 14px; color: var(--muted); font-weight: var(--weight); margin-left: var(--space-xs); }
      .float-card.c1 { top: 4%; left: -8%; }
      .float-card.c2 { top: 4%; right: -10%; }
      .float-card.c3 { bottom: 18%; left: -12%; }
      .float-card.c4 { bottom: 18%; right: -14%; }
      .spark { width: 100px; height: 28px; margin-top: 6px; display: block; color: var(--info); }
      .bottom-bar { display: flex; gap: var(--space); padding: 0 var(--space-xl) var(--space-lg); align-items: stretch; }
      .chips { flex: 1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--card); border: var(--line-width) solid var(--line-soft); border-radius: var(--radius); padding: 14px 18px; }
      .chip { display: flex; align-items: center; gap: var(--space-sm); font-size: 13px; padding: var(--space-sm) 14px; border-radius: var(--radius-pill); background: var(--chip); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot.g { background: var(--ok); }
      .dot.a { background: var(--warn); }
      .dot.b { background: var(--info); }
      .dot.r { background: var(--danger); }
      .presence { display: flex; gap: 14px; align-items: center; background: var(--card); border: var(--line-width) solid var(--line-soft); border-radius: var(--radius); padding: 10px 20px 22px; }
      .presence .lbl { font-size: 11px; color: var(--tab-idle); text-transform: uppercase; letter-spacing: .08em; }
      .presence .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: var(--weight-strong); font-size: 14px; background: var(--chip); border: 2px solid var(--line); position: relative; color: var(--text); }
      .presence .avatar.home { border-color: var(--ok); }
      .presence .avatar.away { opacity: .4; }
      .presence .tip { position: absolute; bottom: -16px; font-size: 9px; color: var(--tab-idle); white-space: nowrap; font-weight: var(--weight); }
      .page { display: flex; flex-direction: column; gap: var(--gap); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr)); gap: var(--gap); }
      .card { background: var(--card); border: var(--line-width) solid var(--line); border-radius: var(--radius); padding: var(--space); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: var(--space-sm); }
      .card.alert { border-color: var(--danger); }
      .card.row { flex-direction: row; }
      h1, h2, h3, p { margin: 0; }
      h1, h2, h3 { font-weight: var(--weight-strong); }
      h2 { font-size: var(--title); }
      .muted { color: var(--muted); }
      .value { font-size: var(--value); font-weight: var(--weight-strong); }
      .row { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; }
      button.action, button.primary { min-height: var(--tap); padding: 0 var(--space); border: 0; border-radius: var(--radius-sm); background: var(--accent-solid); color: var(--accent-ink); font-weight: var(--weight-strong); }
      button.ghost { min-height: var(--tap); padding: 0 var(--space); border-radius: var(--radius-sm); border: var(--line-width) solid var(--line); background: transparent; }
      input[type="range"] { width: 100%; height: var(--tap); accent-color: var(--accent-solid); }
      input[type="password"], input[type="text"] { width: 100%; min-height: var(--tap); border-radius: var(--radius-sm); border: var(--line-width) solid var(--line); background: var(--bg); padding: 0 var(--space-sm); }
      .avatar { width: var(--tap); height: var(--tap); border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: var(--weight-strong); flex: none; }
      .shot { width: 100%; border-radius: var(--radius-sm); background: var(--bg); }
      .chart { width: 100%; height: var(--chart-h); color: var(--accent-solid); }
      #gate:not([hidden]) { min-height: 100vh; display: grid; place-items: center; padding: var(--space); }
      #gate .card, #modal .card { width: min(420px, 100%); }
      [hidden] { display: none !important; }
      #modal:not([hidden]) { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; padding: var(--space); z-index: 3; }
    </style>
  </head>
  <body>
    <div id="gate" hidden>
      <form class="card" id="pin-form">
        <h1>Gulavillan</h1>
        <p class="muted" id="gate-text">Sidan är låst med en pinkod som du valt i Home Assistant.</p>
        <input id="pin" type="password" autocomplete="current-password" placeholder="Pinkod" />
        <p class="muted" id="pin-status"></p>
        <button class="primary" type="submit">Öppna</button>
      </form>
    </div>
    <div id="app" hidden>
      <nav id="tabs" aria-label="Sidor"></nav>
      <div id="view"></div>
    </div>
    <div id="modal" hidden>
      <form class="card" id="alarm-form">
        <h2 id="alarm-title">Larm</h2>
        <p class="muted">Skriv sidans pinkod för att ändra larmet.</p>
        <input id="alarm-pin" type="password" autocomplete="current-password" placeholder="Pinkod" />
        <input id="alarm-code" type="password" placeholder="Larmkod" hidden />
        <p class="muted" id="alarm-status"></p>
        <div class="row">
          <button class="primary" type="submit">Bekräfta</button>
          <button class="ghost" id="alarm-cancel" type="button">Avbryt</button>
        </div>
      </form>
    </div>
    <script>
      const ON = new Set(["on", "open", "unlocked", "home", "heat", "cool", "heat_cool", "dry", "fan_only", "playing", "paused", "buffering"]);
      const LABELS = { on: "På", off: "Av", unavailable: "Otillgänglig", unknown: "Okänt", heat: "Värme", cool: "Kyla", heat_cool: "Auto", auto: "Auto", dry: "Avfukt", fan_only: "Fläkt", open: "Öppen", closed: "Stängd", locked: "Låst", unlocked: "Olåst", home: "Hemma", not_home: "Borta", playing: "Spelar", paused: "Paus", buffering: "Buffrar", idle: "Vilande", standby: "Vilande", charging: "Laddar", disarmed: "Avväpnat", armed_home: "Hemma", armed_away: "Borta", armed_night: "Natt", armed_vacation: "Borta", pending: "Väntar", arming: "Aktiverar", disarming: "Avaktiverar", triggered: "Utlöst", sunny: "Sol", cloudy: "Moln", partlycloudy: "Halvklart", rainy: "Regn", pouring: "Skyfall", snowy: "Snö", lightning: "Åska", fog: "Dimma", windy: "Blåsigt", hail: "Hagel", "clear-night": "Klart", exceptional: "Oväder" };
      const TABS = { hem: "Hem", belysning: "Belysning", klimat: "Klimat", narvaro: "Närvaro", sakerhet: "Säkerhet", energi: "Energi", media: "Media", system: "System", familj: "Familj" };
      const ALARM_MODES = [["disarm", "Avväpna"], ["arm_home", "Hemma"], ["arm_away", "Borta"], ["arm_night", "Natt"]];
      const ALARM_FEATURES = { arm_home: 1, arm_away: 2, arm_night: 4 };
      let home = null;
      let states = {};
      let slots = { lights: [] };
      let tab = "hem";
      let designSvg = "";
      let svgRoot = null;
      let alarmTarget = null;
      const view = document.querySelector("#view");
      const gate = document.querySelector("#gate");
      const app = document.querySelector("#app");

      function h(tag, props, children) {
        const node = document.createElement(tag);
        const options = props || {};
        if (options.class) node.className = options.class;
        if (options.type) node.type = options.type;
        if (options.text != null) node.textContent = String(options.text);
        if (options.alt != null) node.alt = options.alt;
        if (options.src) node.src = options.src;
        for (const child of children || []) if (child) node.append(child);
        return node;
      }

      function allEntities() {
        const list = [];
        for (const floor of home?.floors || []) for (const area of floor.areas) list.push(...area.entities);
        return list;
      }

      function seedStates() {
        for (const entity of allEntities()) {
          if (!states[entity.entity_id]) {
            states[entity.entity_id] = { state: entity.state, last_changed: entity.last_changed, attributes: entity.attributes || {} };
          }
        }
      }

      function live(entity) {
        return states[entity.entity_id] || { state: entity.state, last_changed: entity.last_changed, attributes: entity.attributes || {} };
      }

      function labelOf(state, kind) {
        if ((kind === "door" || kind === "window" || kind === "opening") && (state === "on" || state === "off")) return state === "on" ? "Öppen" : "Stängd";
        if ((kind === "smoke" || kind === "moisture") && (state === "on" || state === "off")) return state === "on" ? "Larm" : "Ok";
        if (kind === "lock" && state === "on") return "Olåst";
        if (kind === "lock" && state === "off") return "Låst";
        return LABELS[String(state)] || String(state ?? "–");
      }

      function formatNumber(value, digits) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "–";
        return new Intl.NumberFormat("sv-SE", { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(number);
      }

      function ago(iso) {
        if (!iso) return "";
        const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (seconds < 60) return "just nu";
        if (seconds < 3600) return "för " + Math.floor(seconds / 60) + " min sedan";
        if (seconds < 86400) return "för " + Math.floor(seconds / 3600) + " tim sedan";
        return "för " + Math.floor(seconds / 86400) + " dygn sedan";
      }

      function grouped(kinds) {
        const want = new Set(kinds);
        return (home.floors || []).map((floor) => ({
          name: floor.name,
          areas: floor.areas.map((area) => ({
            name: area.name,
            entities: area.entities.filter((entity) => want.has(entity.kind)),
          })).filter((area) => area.entities.length),
        })).filter((floor) => floor.areas.length);
      }

      function findEntity(id) {
        return allEntities().find((entity) => entity.entity_id === id) || null;
      }

      function serviceCall(body) {
        if (body.action === "toggle") return ["homeassistant", "toggle", { entity_id: body.entity_id }];
        if (body.action === "turn_off") return ["homeassistant", "turn_off", { entity_id: body.entity_ids }];
        if (body.action === "brightness") {
          const percent = Number(body.brightness_pct);
          if (!percent) return ["light", "turn_off", { entity_id: body.entity_id }];
          return ["light", "turn_on", { entity_id: body.entity_id, brightness_pct: percent }];
        }
        if (body.action === "climate_temperature") return ["climate", "set_temperature", { entity_id: body.entity_id, temperature: body.temperature }];
        if (body.action === "climate_mode") return ["climate", "set_hvac_mode", { entity_id: body.entity_id, hvac_mode: body.hvac_mode }];
        if (body.action === "media" && body.command === "volume") return ["media_player", "volume_set", { entity_id: body.entity_id, volume_level: body.volume_level }];
        if (body.action === "media") return ["media_player", "media_play_pause", { entity_id: body.entity_id }];
        return null;
      }

      async function act(body) {
        if (mode === "ha" && ha) {
          try {
            if (body.action === "alarm") {
              await ha.send("gulavillan_dashboard/alarm", {
                entity_id: body.entity_id,
                mode: body.mode,
                pin: body.pin || "",
                code: body.code || "",
              });
              return true;
            }
            const call = serviceCall(body);
            if (!call) return false;
            await ha.send("call_service", { domain: call[0], service: call[1], service_data: call[2] });
            return true;
          } catch (err) {
            return false;
          }
        }
        const response = await fetch("/api/action", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        return response.ok;
      }

      async function historyPoints(entity, hours) {
        if (mode === "ha" && accessToken) {
          const start = new Date(Date.now() - hours * 3600000).toISOString();
          const response = await fetch("/api/history/period/" + start + "?filter_entity_id=" + encodeURIComponent(entity) + "&minimal_response", {
            headers: { Authorization: "Bearer " + accessToken },
          });
          if (!response.ok) return [];
          const payload = await response.json();
          const rows = Array.isArray(payload) ? payload.flat() : [];
          return rows.map((row) => Number(row.state)).filter((value) => Number.isFinite(value));
        }
        const response = await fetch("/api/history?entity_id=" + encodeURIComponent(entity) + "&hours=" + hours, { credentials: "same-origin" });
        return response.ok ? ((await response.json()).points || []) : [];
      }

      function syncSlots() {
        const villa = home?.villa || {};
        slots = {
          outdoor: villa.outdoor || "",
          outdoorKind: villa.outdoor_kind || "",
          indoor: villa.indoor || "",
          humidity: villa.humidity || "",
          climate: villa.climate || "",
          door: villa.door || "",
          lights: villa.lights || [],
        };
      }

      function entityFor(el) {
        if (el.dataset.slot === "light") return slots.lights[Number(el.dataset.index || 0)] || "";
        if (el.dataset.slot === "price") return home?.focus?.price || "";
        if (el.dataset.slot) return slots[el.dataset.slot] || "";
        return el.dataset.entity || "";
      }

      function rawValue(state, el) {
        if (el.dataset.slot === "outdoor" && slots.outdoorKind === "weather") {
          const temp = state?.attributes?.temperature;
          return temp == null || temp === "" ? null : temp;
        }
        if (el.dataset.slot === "indoor") {
          const numeric = state && Number.isFinite(Number(state.state)) ? state.state : null;
          if (numeric != null && state.state !== "unavailable" && state.state !== "unknown") return numeric;
          const indoor = states[slots.climate]?.attributes?.current_temperature;
          if (indoor != null && indoor !== "") return indoor;
        }
        if (!state) return null;
        if (state.state === "unavailable" || state.state === "unknown") return null;
        return state.state;
      }

      function textOf(state, el) {
        const widget = el.dataset.widget;
        if (widget === "clock") return new Intl.DateTimeFormat("sv-SE", { hour: "2-digit", minute: "2-digit" }).format(new Date());
        if (widget === "date") return new Intl.DateTimeFormat("sv-SE", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
        if (widget === "name") {
          if (state?.attributes?.friendly_name) return state.attributes.friendly_name;
          if (el.dataset.slot === "indoor") return states[slots.climate]?.attributes?.friendly_name || "";
          return "";
        }
        if (widget === "unit") {
          const unit = (state?.attributes?.unit_of_measurement || el.textContent || "").trim();
          return unit ? " " + unit : "";
        }
        const raw = rawValue(state, el);
        if (raw == null) return widget === "label" ? "" : "–";
        if (widget === "label") return LABELS[String(raw)] || String(raw);
        if (el.dataset.decimals != null && el.dataset.decimals !== "") {
          const number = Number(raw);
          if (Number.isFinite(number)) return formatNumber(number, Number(el.dataset.decimals));
        }
        return String(raw);
      }

      function apply(root) {
        syncSlots();
        root.querySelectorAll("[data-widget]").forEach((el) => {
          const widget = el.dataset.widget;
          const state = states[entityFor(el)];
          if (["value", "label", "name", "unit", "clock", "date"].includes(widget)) el.textContent = textOf(state, el);
          if (widget === "state-fill") {
            const on = state && ON.has(state.state);
            if (el.dataset.on && el.dataset.off) el.setAttribute("fill", on ? el.dataset.on : el.dataset.off);
          }
          if (widget === "visible-on" || widget === "visible-off") {
            const on = !!(state && ON.has(state.state));
            el.style.display = (widget === "visible-on" ? on : !on) ? "" : "none";
          }
          if (widget === "bar") {
            if (!el.dataset.fullWidth) el.dataset.fullWidth = el.getAttribute("width") || "100";
            const min = Number(el.dataset.min || 0);
            const max = Number(el.dataset.max || 100);
            const value = Number(rawValue(state, el));
            const ratio = Number.isFinite(value) ? Math.min(1, Math.max(0, (value - min) / (max - min || 1))) : 0;
            el.setAttribute("width", String(Number(el.dataset.fullWidth) * ratio));
          }
        });
      }

      async function drawSparks(svg) {
        const plots = [...svg.querySelectorAll('[data-widget="sparkline"]')];
        await Promise.all(plots.map(async (el, index) => {
          const entity = entityFor(el);
          if (!entity) return;
          const points = await historyPoints(entity, Number(el.dataset.hours || 24));
          const current = Number(rawValue(states[entity], el));
          if (Number.isFinite(current)) points.push(current);
          if (points.length < 2) return;
          const x = Number(el.getAttribute("x") || 0);
          const y = Number(el.getAttribute("y") || 0);
          const width = Number(el.getAttribute("width") || 200);
          const height = Number(el.getAttribute("height") || 80);
          let line = svg.querySelector('polyline[data-spark="' + index + '"]');
          if (!line) {
            line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            line.setAttribute("fill", "none");
            line.setAttribute("stroke", el.dataset.stroke || "currentColor");
            line.setAttribute("stroke-width", el.dataset.strokeWidth || "2");
            line.setAttribute("stroke-linejoin", "round");
            line.setAttribute("stroke-linecap", "round");
            line.dataset.spark = String(index);
            el.parentNode.append(line);
          }
          const min = Math.min(...points);
          const max = Math.max(...points);
          const span = max - min || 1;
          const step = width / (points.length - 1);
          line.setAttribute("points", points.map((value, i) => {
            const px = x + i * step;
            const py = y + height - ((value - min) / span) * (height - 12) - 6;
            return px.toFixed(1) + "," + py.toFixed(1);
          }).join(" "));
        }));
      }

      let hemRoot = null;
      let mode = "legacy";
      let ha = null;
      let pageVersion = new URLSearchParams(location.search).get("v") || "";
      let accessToken = "";

      function chip(kind, text) {
        const node = h("div", { class: "chip" });
        node.append(h("span", { class: "dot " + kind }));
        node.append(document.createTextNode(text));
        return node;
      }

      function statusChips() {
        syncSlots();
        const nodes = [];
        const alarm = allEntities().find((entity) => entity.kind === "alarm");
        if (alarm) {
          const state = live(alarm).state;
          const dot = state === "triggered" ? "r" : (state === "disarmed" ? "g" : "a");
          nodes.push(chip(dot, "Larm: " + labelOf(state)));
        }
        if (slots.door && states[slots.door]) {
          const state = states[slots.door].state;
          const open = state === "on" || state === "open";
          const name = findEntity(slots.door)?.name || "Dörr";
          nodes.push(chip(open ? "a" : "g", name + ": " + (open ? "Öppen" : "Stängd")));
        }
        const lights = allEntities().filter((entity) => entity.kind === "light");
        const lit = lights.filter((entity) => live(entity).state === "on").length;
        if (lights.length) {
          const text = lit === 1 ? "1 lampa tänd" : (lit ? lit + " lampor tända" : "Alla släckta");
          nodes.push(chip(lit ? "a" : "g", text));
        }
        const price = findEntity(home?.focus?.price);
        if (price) {
          const state = live(price);
          const unit = state.attributes.unit_of_measurement || "";
          nodes.push(chip("b", "Elpris " + formatNumber(state.state, 2) + (unit ? " " + unit : "")));
        }
        return nodes;
      }

      function fillPresence(host) {
        host.replaceChildren(h("span", { class: "lbl", text: "Närvaro" }));
        const people = allEntities().filter((entity) => entity.kind === "person");
        if (!people.length) {
          host.append(h("span", { class: "muted", text: "Ingen" }));
          return;
        }
        for (const person of people.slice(0, 8)) {
          const atHome = live(person).state === "home";
          const avatar = h("div", { class: atHome ? "avatar home" : "avatar away" });
          avatar.append(document.createTextNode((person.name || "?").trim().charAt(0).toUpperCase()));
          avatar.append(h("span", { class: "tip", text: atHome ? "Hemma" : "Borta" }));
          host.append(avatar);
        }
      }

      function refreshHem() {
        if (!hemRoot) return;
        apply(hemRoot);
        const chips = hemRoot.querySelector(".chips");
        const presence = hemRoot.querySelector(".presence");
        if (chips) chips.replaceChildren(...statusChips());
        if (presence) fillPresence(presence);
      }

      function floatCard(place, label, slot, decimals, unit, spark) {
        const card = h("div", { class: "float-card " + place });
        card.append(h("div", { class: "lbl", text: label }));
        const value = h("div", { class: "val" });
        const number = document.createElement("span");
        number.dataset.slot = slot;
        number.dataset.widget = "value";
        number.dataset.decimals = String(decimals);
        number.textContent = "–";
        value.append(number);
        if (unit) {
          const small = document.createElement("small");
          small.dataset.slot = slot;
          small.dataset.widget = "unit";
          small.textContent = unit;
          value.append(small);
        }
        card.append(value);
        if (spark) {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "spark");
          svg.setAttribute("viewBox", "0 0 100 28");
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", "0");
          rect.setAttribute("y", "0");
          rect.setAttribute("width", "100");
          rect.setAttribute("height", "28");
          rect.setAttribute("fill", "none");
          rect.dataset.slot = "outdoor";
          rect.dataset.widget = "sparkline";
          rect.dataset.hours = "24";
          rect.dataset.stroke = "currentColor";
          rect.dataset.strokeWidth = "1.5";
          svg.append(rect);
          card.append(svg);
        }
        return card;
      }

        if (hemRoot && view.contains(hemRoot)) {
          refreshHem();

        svgRoot = parsed.querySelector("svg");

        svgRoot.addEventListener("click", (event) => {

        const time = h("div", { class: "t", text: "--:--" });
        time.dataset.widget = "clock";
        const date = h("div", { class: "d" });
        date.dataset.widget = "date";

      async function drawPrice(host, entityId) {
        const hours = Math.max(1, new Date().getHours() + 1);
        const points = await historyPoints(entityId, hours);
        if (points.length < 2) return;
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 300 80");
        svg.setAttribute("class", "chart");
        const min = Math.min(...points);
        const max = Math.max(...points);
        const span = max - min || 1;
        const step = 300 / (points.length - 1);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        line.setAttribute("fill", "none");
        line.setAttribute("stroke", "currentColor");
        line.setAttribute("stroke-width", "3");
        line.setAttribute("points", points.map((value, i) => (i * step).toFixed(1) + "," + (74 - ((value - min) / span) * 68).toFixed(1)).join(" "));
        svg.append(line);
        host.append(svg);
      }

      function renderTabs() {
        const nav = document.querySelector("#tabs");
        nav.replaceChildren(...(home.tabs || ["hem"]).map((id) => {
          const button = h("button", { type: "button", text: TABS[id] || id });
          button.setAttribute("aria-selected", id === tab ? "true" : "false");
          button.addEventListener("click", () => {
            tab = id;
            history.replaceState(null, "", "#" + id);
            renderTabs();
            render();
          });
          return button;
        }));
      }

      function render() {
        if (!home.tabs?.includes(tab)) tab = "hem";
        view.classList.toggle("hem", tab === "hem");
        if (tab === "hem") {
          ensureVilla();
          return;
        }
        const page = h("div", { class: "page" });
        RENDER[tab](page);
        view.replaceChildren(page);
        const chart = page.querySelector("[data-chart]");
        if (chart && home.focus?.price) drawPrice(chart, home.focus.price);
      }

      function openAlarm(entity, mode) {
        alarmTarget = { entity, mode };
        document.querySelector("#alarm-title").textContent = entity.name;
        document.querySelector("#alarm-code").hidden = !live(entity).attributes.code_arm_required;
        document.querySelector("#alarm-status").textContent = "";
        document.querySelector("#alarm-pin").value = "";
        document.querySelector("#modal").hidden = false;
      }

      function connect() {
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(protocol + "://" + location.host + "/api/live");
        socket.onmessage = (event) => {
          const message = JSON.parse(event.data);
          if (message.type === "snapshot") states = message.states || {};
          if (message.type === "state") states[message.entity_id] = message.state;
          seedStates();
          if (tab === "hem" && hemRoot) {
            refreshHem();
            if (message.type === "snapshot") drawSparks(hemRoot);
            return;
          }
          const active = document.activeElement;
          if (active && view.contains(active) && active.matches("input")) return;
          render();
        };
        socket.onclose = () => setTimeout(connect, 2000);
      }

      async function show() {
        gate.hidden = true;
        app.hidden = false;
        if (mode === "ha" && ha) {
          home = await ha.send("gulavillan_dashboard/entities");
          const drawing = await fetch("page.svg?v=" + encodeURIComponent(pageVersion));
          designSvg = drawing.ok ? await drawing.text() : "";
          const listed = await ha.send("get_states");
          if (Array.isArray(listed)) {
            for (const item of listed) {
              states[item.entity_id] = { state: item.state, last_changed: item.last_changed, attributes: item.attributes || {} };
            }
          }
          await ha.send("subscribe_events", { event_type: "state_changed" });
          ha.onEvent = (event) => {
            if (event.event_type !== "state_changed") return;
            const fresh = event.data && event.data.new_state;
            if (!fresh) return;
            states[event.data.entity_id] = { state: fresh.state, last_changed: fresh.last_changed, attributes: fresh.attributes || {} };
            if (tab === "hem" && hemRoot) {
              refreshHem();
              return;
            }
            const active = document.activeElement;
            if (active && view.contains(active) && active.matches("input")) return;
            render();
          };
        } else {
          const [homeResponse, designResponse] = await Promise.all([
            fetch("/api/home", { credentials: "same-origin" }),
            fetch("/api/design", { credentials: "same-origin" }),
          ]);
          home = await homeResponse.json();
          designSvg = (await designResponse.json()).svg || "";
        }
        seedStates();
        const hash = location.hash.slice(1);
        if (home.tabs?.includes(hash)) tab = hash;
        renderTabs();
        render();
        if (mode !== "ha") connect();
        setInterval(() => { if (tab === "hem") refreshHem(); }, 1000);
        setInterval(async () => {
          const response = await fetch("/api/home", { credentials: "same-origin" });
          if (!response.ok) return;
          home = await response.json();
          seedStates();
          renderTabs();
          if (tab !== "hem") render();
        }, 120000);
      }

      document.querySelector("#pin-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: document.querySelector("#pin").value.trim() }),
        });
        document.querySelector("#pin-status").textContent = response.ok ? "" : "Fel pinkod";
        if (response.ok) show();
      });
      document.querySelector("#alarm-cancel").addEventListener("click", () => { document.querySelector("#modal").hidden = true; });
      document.querySelector("#alarm-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!alarmTarget) return;
        const ok = await act({
          action: "alarm",
          entity_id: alarmTarget.entity.entity_id,
          mode: alarmTarget.mode,
          pin: document.querySelector("#alarm-pin").value,
          code: document.querySelector("#alarm-code").value,
        });
        document.querySelector("#alarm-status").textContent = ok ? "" : "Pinkoden stämmer inte";
        if (ok) document.querySelector("#modal").hidden = true;
      });

      function HaClient(token) {
        this.token = token;
        this.id = 1;
        this.pending = new Map();
        this.onEvent = null;
      }
      HaClient.prototype.connect = function () {
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(protocol + "://" + location.host + "/api/websocket");
        this.ws = socket;
        const client = this;
        return new Promise((resolve, reject) => {
          socket.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.type === "auth_required") {
              socket.send(JSON.stringify({ type: "auth", access_token: client.token }));
            } else if (message.type === "auth_ok") {
              socket.onmessage = (next) => client._receive(JSON.parse(next.data));
              resolve();
            } else if (message.type === "auth_invalid") {
              reject(new Error("auth"));
            }
          };
          socket.onerror = () => reject(new Error("socket"));
        });
      };
      HaClient.prototype.send = function (type, extra) {
        const id = this.id++;
        const client = this;
        return new Promise((resolve, reject) => {
          client.pending.set(id, { resolve, reject });
          client.ws.send(JSON.stringify(Object.assign({ id, type }, extra || {})));
        });
      };
      HaClient.prototype._receive = function (message) {
        if (message.type === "result" && this.pending.has(message.id)) {
          const waiter = this.pending.get(message.id);
          this.pending.delete(message.id);
          if (message.success) waiter.resolve(message.result);
          else waiter.reject(message.error || new Error("failed"));
          return;
        }
        if (message.type === "event" && this.onEvent) this.onEvent(message.event);
      };

      function waitForPanelToken() {
        return new Promise((resolve) => {
          const timer = setTimeout(() => resolve(""), 700);
          window.addEventListener("message", function onMessage(event) {
            if (event.origin !== location.origin) return;
            if (!event.data || event.data.type !== "gulavillan-auth") return;
            clearTimeout(timer);
            window.removeEventListener("message", onMessage);
            resolve(event.data.access_token || "");
          });
        });
      }

      async function tokenFromStorage() {
        try {
          const saved = JSON.parse(localStorage.getItem("hassTokens") || "null");
          if (!saved || !saved.access_token) return "";
          if (!saved.expires || saved.expires > Date.now() + 10000) return saved.access_token;
          if (!saved.refresh_token) return "";
          const body = new URLSearchParams({
            grant_type: "refresh_token",
            refresh_token: saved.refresh_token,
            client_id: saved.clientId || location.origin,
          });
          const response = await fetch("/auth/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body,
          });
          if (!response.ok) return "";
          const fresh = await response.json();
          saved.access_token = fresh.access_token;
          saved.expires = Date.now() + (fresh.expires_in || 1800) * 1000;
          localStorage.setItem("hassTokens", JSON.stringify(saved));
          return fresh.access_token;
        } catch (err) {
          return "";
        }
      }

      async function loadVersion() {
        try {
          const response = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
          if (!response.ok) return;
          const data = await response.json();
          if (!data.version) return;
          pageVersion = data.version;
          const link = document.querySelector('link[rel="stylesheet"]');
          if (link) link.href = "theme.css?v=" + encodeURIComponent(pageVersion);
        } catch (err) {
          /* Legacy port has no version file. */
        }
      }

      function watchVersion() {
        setInterval(async () => {
          try {
            const response = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
            if (!response.ok) return;
            const data = await response.json();
            if (!data.version || data.version === pageVersion) return;
            const url = new URL(location.href);
            url.searchParams.set("v", data.version);
            location.replace(url.toString());
          } catch (err) {
            /* Ignore until the next check. */
          }
        }, 30000);
      }

      async function boot() {
        await loadVersion();
        watchVersion();
        const posted = await waitForPanelToken();
        accessToken = posted || await tokenFromStorage();
        if (accessToken) {
          try {
            ha = new HaClient(accessToken);
            await ha.connect();
            mode = "ha";
            show();
            return;
          } catch (err) {
            ha = null;
            mode = "legacy";
          }
        }
        let response = null;
        try {
          response = await fetch("/api/session", { credentials: "same-origin" });
        } catch (err) {
          response = null;
        }
        if (response && response.status === 401) {
          gate.hidden = false;
          app.hidden = true;
          return;
        }
        if (response && response.ok) {
          show();
          return;
        }
        document.querySelector("#gate-text").textContent = "Öppna Gulavillan från sidomenyn efter att du loggat in i Home Assistant.";
        document.querySelector("#pin").hidden = true;
        document.querySelector("#pin-form button").hidden = true;
        gate.hidden = false;
      }
      boot();
    </script>
  </body>
</html>
