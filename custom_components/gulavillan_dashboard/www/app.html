<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gulavillan</title>
    <style>
      :root { color-scheme: dark; --bg: #10151c; --card: #1b2430; --text: #f4f0e8; --muted: #b3aa9c; --accent: #e0b15a; --line: rgba(255, 255, 255, 0.08); }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
      button, input { font: inherit; color: inherit; }
      #stage { width: 100vw; height: 100vh; }
      #stage svg { width: 100vw; height: 100vh; display: block; }
      #stage svg [data-action="toggle"] { cursor: pointer; }
      #gate:not([hidden]) { min-height: 100%; display: grid; place-items: center; }
      [hidden] { display: none !important; }
      .card { width: min(420px, calc(100% - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; }
      .card h1 { margin: 0 0 8px; letter-spacing: -0.03em; }
      .card p { color: var(--muted); }
      input { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: #10151c; padding: 12px; }
      button.primary { background: var(--accent); color: #1c1408; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; font-weight: 650; }
      .status { color: var(--muted); min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div id="gate" hidden>
      <form class="card" id="pin-form">
        <h1>Gulavillan</h1>
        <p>Sidan är låst med en pinkod som du valt i Home Assistant.</p>
        <input id="pin" type="password" autocomplete="current-password" placeholder="Pinkod" />
        <p class="status" id="pin-status"></p>
        <button class="primary" type="submit">Öppna</button>
      </form>
    </div>
    <div id="stage" hidden></div>
    <script>
      const ON = new Set(["on", "open", "unlocked", "home", "heat", "cool", "heat_cool", "dry", "fan_only", "playing"]);
      const LABELS = { on: "På", off: "Av", unavailable: "Otillgänglig", unknown: "Okänt", heat: "Värme", cool: "Kyla", open: "Öppen", closed: "Stängd", locked: "Låst", unlocked: "Olåst" };
      let states = {};
      let slots = { lights: [] };

      function resolveSlots() {
        const list = Object.entries(states);
        const label = (id, state) => `${id} ${state.attributes?.friendly_name || ""}`.toLowerCase();
        const temps = list.filter(([id, state]) => id.startsWith("sensor.") && (state.attributes?.device_class === "temperature" || state.attributes?.unit_of_measurement === "°C" || state.attributes?.unit_of_measurement === "°F"));
        const outdoor = temps.find(([id, state]) => /ute|utom|out|outside|weather|vader|tradgard|balkong|fasad/.test(label(id, state)));
        const indoorNamed = temps.find((item) => item !== outdoor && /inne|inom|indoor|vardagsrum|boyta|rum|kok|sovrum/.test(label(item[0], item[1])));
        const indoor = indoorNamed || temps.find((item) => item !== outdoor);
        const humidity = list.find(([id, state]) => id.startsWith("sensor.") && state.attributes?.device_class === "humidity")
          || list.find(([id, state]) => id.startsWith("sensor.") && state.attributes?.unit_of_measurement === "%" && /fukt|humid/.test(label(id, state)));
        const climate = list.find(([id]) => id.startsWith("climate."));
        const weather = list.find(([id]) => id.startsWith("weather."));
        const pool = list.filter(([id]) => id.startsWith("light.")).map(([id]) => id);
        const lights = [];
        for (const hint of [/vardagsrum|living/, /kok|kitchen/, /hall|entre|entry/, /sovrum|bed/]) {
          const index = pool.findIndex((id) => hint.test(label(id, states[id] || {})));
          if (index >= 0) lights.push(pool.splice(index, 1)[0]);
        }
        pool.sort((a, b) => label(a, states[a] || {}).localeCompare(label(b, states[b] || {}), "sv"));
        lights.push(...pool);
        const door = list.find(([id, state]) => id.startsWith("binary_sensor.") && (state.attributes?.device_class === "door" || state.attributes?.device_class === "garage_door" || /dorr|door|ytter|entre/.test(label(id, state))));
        slots = {
          outdoor: outdoor?.[0] || weather?.[0] || "sensor.temperatur_ute",
          indoor: indoor?.[0] || "sensor.temperatur_inne",
          humidity: humidity?.[0] || "sensor.luftfuktighet",
          climate: climate?.[0] || "climate.vardagsrum",
          door: door?.[0] || "binary_sensor.ytterdorr",
          lights,
        };
      }

      function entityFor(el) {
        if (el.dataset.slot === "light") return slots.lights[Number(el.dataset.index || 0)] || el.dataset.entity;
        if (el.dataset.slot && slots[el.dataset.slot]) return slots[el.dataset.slot];
        return el.dataset.entity;
      }
      const stage = document.querySelector("#stage");
      const gate = document.querySelector("#gate");

      async function session() {
        const response = await fetch("/api/session", { credentials: "same-origin" });
        if (response.status === 401) return null;
        return response.json();
      }

      async function login(pin) {
        const response = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: pin.trim() }),
        });
        return response.ok;
      }

      function rawValue(state, el) {
        if (el.dataset.slot === "outdoor" && String(slots.outdoor).startsWith("weather.")) {
          const temp = state?.attributes?.temperature;
          return temp == null || temp === "" ? null : temp;
        }
        if (el.dataset.slot === "indoor") {
          const numeric = state && Number.isFinite(Number(state.state)) ? state.state : null;
          if (numeric != null && state.state !== "unavailable" && state.state !== "unknown") return numeric;
          const indoor = states[slots.climate]?.attributes?.current_temperature;
          if (indoor != null && indoor !== "") return indoor;
        }
        if (!state) return null;
        if (el.dataset.attribute) {
          const value = state.attributes?.[el.dataset.attribute];
          return value == null || value === "" ? null : value;
        }
        if (state.state === "unavailable" || state.state === "unknown") return null;
        return state.state;
      }

      function textOf(state, el) {
        const widget = el.dataset.widget;
        if (widget === "clock") return new Intl.DateTimeFormat("sv-SE", { hour: "2-digit", minute: "2-digit" }).format(new Date());
        if (widget === "date") return new Intl.DateTimeFormat("sv-SE", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
        if (widget === "name") {
          if (state?.attributes?.friendly_name) return state.attributes.friendly_name;
          if (el.dataset.slot === "indoor") return states[slots.climate]?.attributes?.friendly_name || "";
          return "";
        }
        if (widget === "unit") return state?.attributes?.unit_of_measurement || el.textContent || "";
        const raw = rawValue(state, el);
        if (raw == null) return widget === "label" ? "" : "–";
        if (widget === "label") return LABELS[String(raw)] || String(raw);
        if (el.dataset.decimals != null && el.dataset.decimals !== "") {
          const number = Number(raw);
          if (Number.isFinite(number)) {
            return new Intl.NumberFormat("sv-SE", {
              minimumFractionDigits: Number(el.dataset.decimals),
              maximumFractionDigits: Number(el.dataset.decimals),
            }).format(number);
          }
        }
        return String(raw);
      }

      function apply(root) {
        resolveSlots();
        root.querySelectorAll("[data-widget]").forEach((el) => {
          const widget = el.dataset.widget;
          const state = states[entityFor(el)];
          if (["value", "label", "name", "unit", "clock", "date"].includes(widget)) el.textContent = textOf(state, el);
          if (widget === "state-fill") {
            const on = state && ON.has(state.state);
            el.setAttribute("fill", on ? (el.dataset.on || "#e0b15a") : (el.dataset.off || "#334155"));
          }
          if (widget === "visible-on" || widget === "visible-off") {
            const on = !!(state && ON.has(state.state));
            const show = widget === "visible-on" ? on : !on;
            el.style.display = show ? "" : "none";
          }
          if (widget === "bar") {
            if (!el.dataset.fullWidth) el.dataset.fullWidth = el.getAttribute("width") || "100";
            const min = Number(el.dataset.min || 0);
            const max = Number(el.dataset.max || 100);
            const value = Number(rawValue(state, el));
            const ratio = Number.isFinite(value) ? Math.min(1, Math.max(0, (value - min) / (max - min || 1))) : 0;
            el.setAttribute("width", String(Number(el.dataset.fullWidth) * ratio));
          }
        });
      }

      async function drawSparks(svg) {
        const plots = [...svg.querySelectorAll('[data-widget="sparkline"]')];
        await Promise.all(plots.map(async (el, index) => {
          const entity = entityFor(el);
          if (!entity) return;
          const response = await fetch(`/api/history?entity_id=${encodeURIComponent(entity)}&hours=${Number(el.dataset.hours || 24)}`, { credentials: "same-origin" });
          const points = response.ok ? ((await response.json()).points || []) : [];
          const live = Number(rawValue(states[entity], el));
          if (Number.isFinite(live)) points.push(live);
          const x = Number(el.getAttribute("x") || 0);
          const y = Number(el.getAttribute("y") || 0);
          const width = Number(el.getAttribute("width") || 200);
          const height = Number(el.getAttribute("height") || 80);
          let line = svg.querySelector(`polyline[data-spark="${index}"]`);
          if (!line) {
            line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            line.setAttribute("fill", "none");
            line.setAttribute("stroke", el.dataset.stroke || "#e0b15a");
            line.setAttribute("stroke-width", "4");
            line.setAttribute("stroke-linejoin", "round");
            line.setAttribute("stroke-linecap", "round");
            line.dataset.spark = String(index);
            el.parentNode.append(line);
          }
          if (points.length < 2) return;
          const min = Math.min(...points);
          const max = Math.max(...points);
          const span = max - min || 1;
          const step = width / (points.length - 1);
          line.setAttribute("points", points.map((value, i) => {
            const px = x + i * step;
            const py = y + height - ((value - min) / span) * (height - 12) - 6;
            return `${px.toFixed(1)},${py.toFixed(1)}`;
          }).join(" "));
        }));
      }

      function connect(svg) {
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${protocol}://${location.host}/api/live`);
        socket.onmessage = (event) => {
          const message = JSON.parse(event.data);
          if (message.type === "snapshot") states = message.states || {};
          if (message.type === "state") states[message.entity_id] = message.state;
          apply(svg);
          if (message.type === "snapshot") drawSparks(svg);
        };
        socket.onclose = () => setTimeout(() => connect(svg), 2000);
      }

      async function show() {
        const body = await (await fetch("/api/design", { credentials: "same-origin" })).json();
        const parsed = new DOMParser().parseFromString(body.svg, "image/svg+xml");
        const svg = parsed.querySelector("svg");
        if (!svg) return;
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");
        stage.replaceChildren(svg);
        stage.hidden = false;
        gate.hidden = true;
        apply(svg);
        drawSparks(svg);
        setInterval(() => apply(svg), 1000);
        connect(svg);
        svg.addEventListener("click", (event) => {
          const target = event.target.closest("[data-action='toggle']");
          const entityId = target ? entityFor(target) : "";
          if (!entityId) return;
          fetch("/api/action", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ entity_id: entityId, action: "toggle" }),
          });
        });
      }

      document.querySelector("#pin-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const ok = await login(document.querySelector("#pin").value);
        document.querySelector("#pin-status").textContent = ok ? "" : "Fel pinkod";
        if (ok) boot();
      });

      async function boot() {
        const info = await session();
        if (!info) {
          gate.hidden = false;
          stage.hidden = true;
          return;
        }
        gate.hidden = true;
        show();
      }
      boot();
    </script>
  </body>
</html>
