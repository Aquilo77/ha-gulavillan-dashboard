<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gulavillan</title>
    <link rel="stylesheet" href="/theme.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-weight: var(--weight); }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      #app { min-height: 100vh; display: flex; flex-direction: column; }
      #tabs { display: flex; gap: var(--space-sm); overflow-x: auto; padding: var(--space-sm) var(--space); position: sticky; top: 0; background: var(--bg); z-index: 2; }
      #tabs button { min-height: var(--tap); padding: 0 var(--space); border-radius: var(--radius-pill); border: var(--line-width) solid var(--line); background: transparent; white-space: nowrap; }
      #tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: var(--weight-strong); }
      #view { flex: 1; padding: var(--space); display: flex; flex-direction: column; gap: var(--gap); }
      #view.hem { padding: 0; }
      #stage { height: calc(100vh - var(--tab-h)); }
      #stage svg { width: 100%; height: 100%; display: block; }
      #stage svg [data-action="toggle"] { cursor: pointer; }
      .page { display: flex; flex-direction: column; gap: var(--gap); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr)); gap: var(--gap); }
      .card { background: var(--card); border: var(--line-width) solid var(--line); border-radius: var(--radius); padding: var(--space); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: var(--space-sm); }
      .card.alert { border-color: var(--danger); }
      .card.row { flex-direction: row; }
      h1, h2, h3, p { margin: 0; }
      h1, h2, h3 { font-weight: var(--weight-strong); }
      h2 { font-size: var(--title); }
      .muted { color: var(--muted); }
      .value { font-size: var(--value); font-weight: var(--weight-strong); }
      .row { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; }
      button.action, button.primary { min-height: var(--tap); padding: 0 var(--space); border: 0; border-radius: var(--radius-sm); background: var(--accent); color: var(--accent-ink); font-weight: var(--weight-strong); }
      button.ghost { min-height: var(--tap); padding: 0 var(--space); border-radius: var(--radius-sm); border: var(--line-width) solid var(--line); background: transparent; }
      input[type="range"] { width: 100%; height: var(--tap); accent-color: var(--accent); }
      input[type="password"], input[type="text"] { width: 100%; min-height: var(--tap); border-radius: var(--radius-sm); border: var(--line-width) solid var(--line); background: var(--bg); padding: 0 var(--space-sm); }
      .avatar { width: var(--tap); height: var(--tap); border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: var(--weight-strong); flex: none; }
      .shot { width: 100%; border-radius: var(--radius-sm); background: var(--bg); }
      .chart { width: 100%; height: var(--chart-h); color: var(--accent); }
      #gate:not([hidden]) { min-height: 100vh; display: grid; place-items: center; padding: var(--space); }
      #gate .card, #modal .card { width: min(420px, 100%); }
      [hidden] { display: none !important; }
      #modal:not([hidden]) { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; padding: var(--space); z-index: 3; }
    </style>
  </head>
  <body>
    <div id="gate" hidden>
      <form class="card" id="pin-form">
        <h1>Gulavillan</h1>
        <p class="muted">Sidan är låst med en pinkod som du valt i Home Assistant.</p>
        <input id="pin" type="password" autocomplete="current-password" placeholder="Pinkod" />
        <p class="muted" id="pin-status"></p>
        <button class="primary" type="submit">Öppna</button>
      </form>
    </div>
    <div id="app" hidden>
      <nav id="tabs" aria-label="Sidor"></nav>
      <div id="view"></div>
    </div>
    <div id="modal" hidden>
      <form class="card" id="alarm-form">
        <h2 id="alarm-title">Larm</h2>
        <p class="muted">Skriv sidans pinkod för att ändra larmet.</p>
        <input id="alarm-pin" type="password" autocomplete="current-password" placeholder="Pinkod" />
        <input id="alarm-code" type="password" placeholder="Larmkod" hidden />
        <p class="muted" id="alarm-status"></p>
        <div class="row">
          <button class="primary" type="submit">Bekräfta</button>
          <button class="ghost" id="alarm-cancel" type="button">Avbryt</button>
        </div>
      </form>
    </div>
    <script>
      const ON = new Set(["on", "open", "unlocked", "home", "heat", "cool", "heat_cool", "dry", "fan_only", "playing", "paused", "buffering"]);
      const LABELS = { on: "På", off: "Av", unavailable: "Otillgänglig", unknown: "Okänt", heat: "Värme", cool: "Kyla", heat_cool: "Auto", auto: "Auto", dry: "Avfukt", fan_only: "Fläkt", open: "Öppen", closed: "Stängd", locked: "Låst", unlocked: "Olåst", home: "Hemma", not_home: "Borta", playing: "Spelar", paused: "Paus", buffering: "Buffrar", idle: "Vilande", standby: "Vilande", charging: "Laddar", disarmed: "Avväpnat", armed_home: "Hemma", armed_away: "Borta", armed_night: "Natt", armed_vacation: "Borta", pending: "Väntar", arming: "Aktiverar", disarming: "Avaktiverar", triggered: "Utlöst", sunny: "Sol", cloudy: "Moln", partlycloudy: "Halvklart", rainy: "Regn", pouring: "Skyfall", snowy: "Snö", lightning: "Åska", fog: "Dimma", windy: "Blåsigt", hail: "Hagel", "clear-night": "Klart", exceptional: "Oväder" };
      const TABS = { hem: "Hem", belysning: "Belysning", klimat: "Klimat", narvaro: "Närvaro", sakerhet: "Säkerhet", energi: "Energi", media: "Media", system: "System", familj: "Familj" };
      const ALARM_MODES = [["disarm", "Avväpna"], ["arm_home", "Hemma"], ["arm_away", "Borta"], ["arm_night", "Natt"]];
      const ALARM_FEATURES = { arm_home: 1, arm_away: 2, arm_night: 4 };
      let home = null;
      let states = {};
      let slots = { lights: [] };
      let tab = "hem";
      let designSvg = "";
      let svgRoot = null;
      let alarmTarget = null;
      const view = document.querySelector("#view");
      const gate = document.querySelector("#gate");
      const app = document.querySelector("#app");

      function h(tag, props, children) {
        const node = document.createElement(tag);
        const options = props || {};
        if (options.class) node.className = options.class;
        if (options.type) node.type = options.type;
        if (options.text != null) node.textContent = String(options.text);
        if (options.alt != null) node.alt = options.alt;
        if (options.src) node.src = options.src;
        for (const child of children || []) if (child) node.append(child);
        return node;
      }

      function allEntities() {
        const list = [];
        for (const floor of home?.floors || []) for (const area of floor.areas) list.push(...area.entities);
        return list;
      }

      function seedStates() {
        for (const entity of allEntities()) {
          if (!states[entity.entity_id]) {
            states[entity.entity_id] = { state: entity.state, last_changed: entity.last_changed, attributes: entity.attributes || {} };
          }
        }
      }

      function live(entity) {
        return states[entity.entity_id] || { state: entity.state, last_changed: entity.last_changed, attributes: entity.attributes || {} };
      }

      function labelOf(state, kind) {
        if ((kind === "door" || kind === "window" || kind === "opening") && (state === "on" || state === "off")) return state === "on" ? "Öppen" : "Stängd";
        if ((kind === "smoke" || kind === "moisture") && (state === "on" || state === "off")) return state === "on" ? "Larm" : "Ok";
        if (kind === "lock" && state === "on") return "Olåst";
        if (kind === "lock" && state === "off") return "Låst";
        return LABELS[String(state)] || String(state ?? "–");
      }

      function formatNumber(value, digits) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "–";
        return new Intl.NumberFormat("sv-SE", { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(number);
      }

      function ago(iso) {
        if (!iso) return "";
        const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (seconds < 60) return "just nu";
        if (seconds < 3600) return "för " + Math.floor(seconds / 60) + " min sedan";
        if (seconds < 86400) return "för " + Math.floor(seconds / 3600) + " tim sedan";
        return "för " + Math.floor(seconds / 86400) + " dygn sedan";
      }

      function grouped(kinds) {
        const want = new Set(kinds);
        return (home.floors || []).map((floor) => ({
          name: floor.name,
          areas: floor.areas.map((area) => ({
            name: area.name,
            entities: area.entities.filter((entity) => want.has(entity.kind)),
          })).filter((area) => area.entities.length),
        })).filter((floor) => floor.areas.length);
      }

      function findEntity(id) {
        return allEntities().find((entity) => entity.entity_id === id) || null;
      }

      async function act(body) {
        const response = await fetch("/api/action", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        return response.ok;
      }

      function syncSlots() {
        const villa = home?.villa || {};
        slots = {
          outdoor: villa.outdoor || "",
          outdoorKind: villa.outdoor_kind || "",
          indoor: villa.indoor || "",
          humidity: villa.humidity || "",
          climate: villa.climate || "",
          door: villa.door || "",
          lights: villa.lights || [],
        };
      }

      function entityFor(el) {
        if (el.dataset.slot === "light") return slots.lights[Number(el.dataset.index || 0)] || "";
        if (el.dataset.slot) return slots[el.dataset.slot] || "";
        return "";
      }

      function rawValue(state, el) {
        if (el.dataset.slot === "outdoor" && slots.outdoorKind === "weather") {
          const temp = state?.attributes?.temperature;
          return temp == null || temp === "" ? null : temp;
        }
        if (el.dataset.slot === "indoor") {
          const numeric = state && Number.isFinite(Number(state.state)) ? state.state : null;
          if (numeric != null && state.state !== "unavailable" && state.state !== "unknown") return numeric;
          const indoor = states[slots.climate]?.attributes?.current_temperature;
          if (indoor != null && indoor !== "") return indoor;
        }
        if (!state) return null;
        if (state.state === "unavailable" || state.state === "unknown") return null;
        return state.state;
      }

      function textOf(state, el) {
        const widget = el.dataset.widget;
        if (widget === "clock") return new Intl.DateTimeFormat("sv-SE", { hour: "2-digit", minute: "2-digit" }).format(new Date());
        if (widget === "date") return new Intl.DateTimeFormat("sv-SE", { weekday: "long", day: "numeric", month: "long" }).format(new Date());
        if (widget === "name") {
          if (state?.attributes?.friendly_name) return state.attributes.friendly_name;
          if (el.dataset.slot === "indoor") return states[slots.climate]?.attributes?.friendly_name || "";
          return "";
        }
        if (widget === "unit") return state?.attributes?.unit_of_measurement || el.textContent || "";
        const raw = rawValue(state, el);
        if (raw == null) return widget === "label" ? "" : "–";
        if (widget === "label") return LABELS[String(raw)] || String(raw);
        if (el.dataset.decimals != null && el.dataset.decimals !== "") {
          const number = Number(raw);
          if (Number.isFinite(number)) return formatNumber(number, Number(el.dataset.decimals));
        }
        return String(raw);
      }

      function apply(root) {
        syncSlots();
        root.querySelectorAll("[data-widget]").forEach((el) => {
          const widget = el.dataset.widget;
          const state = states[entityFor(el)];
          if (["value", "label", "name", "unit", "clock", "date"].includes(widget)) el.textContent = textOf(state, el);
          if (widget === "state-fill") {
            const on = state && ON.has(state.state);
            if (el.dataset.on && el.dataset.off) el.setAttribute("fill", on ? el.dataset.on : el.dataset.off);
          }
          if (widget === "visible-on" || widget === "visible-off") {
            const on = !!(state && ON.has(state.state));
            el.style.display = (widget === "visible-on" ? on : !on) ? "" : "none";
          }
          if (widget === "bar") {
            if (!el.dataset.fullWidth) el.dataset.fullWidth = el.getAttribute("width") || "100";
            const min = Number(el.dataset.min || 0);
            const max = Number(el.dataset.max || 100);
            const value = Number(rawValue(state, el));
            const ratio = Number.isFinite(value) ? Math.min(1, Math.max(0, (value - min) / (max - min || 1))) : 0;
            el.setAttribute("width", String(Number(el.dataset.fullWidth) * ratio));
          }
        });
      }

      async function drawSparks(svg) {
        const plots = [...svg.querySelectorAll('[data-widget="sparkline"]')];
        await Promise.all(plots.map(async (el, index) => {
          const entity = entityFor(el);
          if (!entity) return;
          const response = await fetch("/api/history?entity_id=" + encodeURIComponent(entity) + "&hours=" + Number(el.dataset.hours || 24), { credentials: "same-origin" });
          const points = response.ok ? ((await response.json()).points || []) : [];
          const current = Number(rawValue(states[entity], el));
          if (Number.isFinite(current)) points.push(current);
          if (points.length < 2) return;
          const x = Number(el.getAttribute("x") || 0);
          const y = Number(el.getAttribute("y") || 0);
          const width = Number(el.getAttribute("width") || 200);
          const height = Number(el.getAttribute("height") || 80);
          let line = svg.querySelector('polyline[data-spark="' + index + '"]');
          if (!line) {
            line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            line.setAttribute("fill", "none");
            line.setAttribute("stroke", el.dataset.stroke || "currentColor");
            line.setAttribute("stroke-width", "4");
            line.setAttribute("stroke-linejoin", "round");
            line.setAttribute("stroke-linecap", "round");
            line.dataset.spark = String(index);
            el.parentNode.append(line);
          }
          const min = Math.min(...points);
          const max = Math.max(...points);
          const span = max - min || 1;
          const step = width / (points.length - 1);
          line.setAttribute("points", points.map((value, i) => {
            const px = x + i * step;
            const py = y + height - ((value - min) / span) * (height - 12) - 6;
            return px.toFixed(1) + "," + py.toFixed(1);
          }).join(" "));
        }));
      }

      function ensureVilla() {
        if (svgRoot && view.contains(svgRoot)) {
          apply(svgRoot);
          return;
        }
        const parsed = new DOMParser().parseFromString(designSvg, "image/svg+xml");
        svgRoot = parsed.querySelector("svg");
        if (!svgRoot) return;
        svgRoot.setAttribute("width", "100%");
        svgRoot.setAttribute("height", "100%");
        const stage = h("div", { id: "stage" });
        stage.id = "stage";
        stage.append(svgRoot);
        view.replaceChildren(stage);
        svgRoot.addEventListener("click", (event) => {
          const target = event.target.closest("[data-action='toggle']");
          const entityId = target ? entityFor(target) : "";
          if (entityId) act({ action: "toggle", entity_id: entityId });
        });
        apply(svgRoot);
        drawSparks(svgRoot);
      }

      function lightCard(entity) {
        const state = live(entity);
        const card = h("article", { class: "card" });
        card.append(h("h3", { text: entity.name }));
        card.append(h("p", { class: "muted", text: labelOf(state.state) }));
        const button = h("button", { class: "action", type: "button", text: state.state === "on" ? "Släck" : "Tänd" });
        button.addEventListener("click", () => act({ action: "toggle", entity_id: entity.entity_id }));
        card.append(button);
        const modes = state.attributes.supported_color_modes || [];
        const dimmable = entity.domain === "light" && (state.attributes.brightness != null || modes.some((mode) => mode !== "onoff"));
        if (dimmable) {
          const input = document.createElement("input");
          input.type = "range";
          input.min = "0";
          input.max = "100";
          const brightness = Number(state.attributes.brightness);
          input.value = Number.isFinite(brightness) ? String(Math.round(brightness / 255 * 100)) : "0";
          input.addEventListener("change", () => act({ action: "brightness", entity_id: entity.entity_id, brightness_pct: Number(input.value) }));
          card.append(input);
        }
        return card;
      }

      function renderLights(page) {
        const lights = allEntities().filter((entity) => entity.kind === "light");
        const all = h("button", { class: "action", type: "button", text: "Släck allt" });
        all.addEventListener("click", () => act({ action: "turn_off", entity_ids: lights.map((entity) => entity.entity_id) }));
        const head = h("div", { class: "row" }, [h("h2", { text: "Belysning" }), all]);
        page.append(head);
        for (const floor of grouped(["light"])) {
          page.append(h("h2", { text: floor.name }));
          for (const area of floor.areas) {
            const off = h("button", { class: "ghost", type: "button", text: "Släck allt" });
            off.addEventListener("click", () => act({ action: "turn_off", entity_ids: area.entities.map((entity) => entity.entity_id) }));
            page.append(h("div", { class: "row" }, [h("h3", { text: area.name }), off]));
            page.append(h("div", { class: "grid" }, area.entities.map(lightCard)));
          }
        }
      }

      function sensorLine(entity) {
        const state = live(entity);
        const unit = state.attributes.unit_of_measurement || "";
        return h("p", { text: entity.name + ": " + formatNumber(state.state, 1) + (unit ? " " + unit : "") });
      }

      function climateCard(entity) {
        const state = live(entity);
        const card = h("article", { class: "card" });
        card.append(h("h3", { text: entity.name }));
        const current = state.attributes.current_temperature;
        const target = state.attributes.temperature;
        card.append(h("p", { class: "value", text: formatNumber(current, 1) + "°" }));
        card.append(h("p", { class: "muted", text: "Mål " + formatNumber(target, 1) + "° · " + labelOf(state.state) }));
        const row = h("div", { class: "row" });
        for (const [delta, text] of [[-0.5, "−"], [0.5, "+"]]) {
          const button = h("button", { class: "ghost", type: "button", text });
          button.addEventListener("click", () => {
            const base = Number(live(entity).attributes.temperature);
            const next = (Number.isFinite(base) ? base : 20) + delta;
            act({ action: "climate_temperature", entity_id: entity.entity_id, temperature: Math.round(next * 2) / 2 });
          });
          row.append(button);
        }
        const modes = state.attributes.hvac_modes || ["heat", "off"];
        for (const mode of modes) {
          const button = h("button", { class: "ghost", type: "button", text: labelOf(mode) });
          button.addEventListener("click", () => act({ action: "climate_mode", entity_id: entity.entity_id, hvac_mode: mode }));
          row.append(button);
        }
        card.append(row);
        return card;
      }

      function renderClimate(page) {
        page.append(h("h2", { text: "Klimat" }));
        const summary = h("div", { class: "grid" });
        const outdoor = findEntity(home.villa?.outdoor);
        if (outdoor) {
          const state = live(outdoor);
          const value = home.villa.outdoor_kind === "weather" ? state.attributes.temperature : state.state;
          summary.append(h("article", { class: "card" }, [
            h("h3", { text: "Ute" }),
            h("p", { class: "value", text: formatNumber(value, 1) + "°" }),
            h("p", { class: "muted", text: outdoor.name }),
          ]));
        }
        const weather = findEntity(home.focus?.weather);
        if (weather) {
          const state = live(weather);
          summary.append(h("article", { class: "card" }, [
            h("h3", { text: weather.name }),
            h("p", { class: "value", text: labelOf(state.state, "weather") }),
            h("p", { class: "muted", text: formatNumber(state.attributes.temperature, 1) + "°" }),
          ]));
        }
        if (summary.childNodes.length) page.append(summary);
        for (const floor of grouped(["climate", "temperature", "humidity", "illuminance"])) {
          page.append(h("h2", { text: floor.name }));
          for (const area of floor.areas) {
            page.append(h("h3", { text: area.name }));
            const climates = area.entities.filter((entity) => entity.kind === "climate");
            const sensors = area.entities.filter((entity) => entity.kind !== "climate");
            if (climates.length) page.append(h("div", { class: "grid" }, climates.map(climateCard)));
            if (sensors.length) page.append(h("article", { class: "card" }, sensors.map(sensorLine)));
          }
        }
      }

      function personCard(entity) {
        const state = live(entity);
        const card = h("article", { class: "card row" });
        card.append(h("div", { class: "avatar", text: (entity.name || "?").trim().charAt(0).toUpperCase() }));
        const text = h("div");
        text.append(h("h3", { text: entity.name }));
        text.append(h("p", { class: "muted", text: labelOf(state.state) }));
        card.append(text);
        return card;
      }

      function motionCard(entity) {
        const state = live(entity);
        const card = h("article", { class: state.state === "on" ? "card alert" : "card" });
        card.append(h("h3", { text: entity.name }));
        card.append(h("p", { text: state.state === "on" ? "Rörelse" : "Still" }));
        card.append(h("p", { class: "muted", text: ago(state.last_changed) }));
        return card;
      }

      function renderPresence(page) {
        page.append(h("h2", { text: "Närvaro" }));
        const people = allEntities().filter((entity) => entity.kind === "person");
        const trackers = allEntities().filter((entity) => entity.kind === "tracker");
        if (people.length) page.append(h("div", { class: "grid" }, people.map(personCard)));
        if (trackers.length) page.append(h("div", { class: "grid" }, trackers.map(personCard)));
        for (const floor of grouped(["motion"])) {
          page.append(h("h2", { text: floor.name }));
          for (const area of floor.areas) {
            page.append(h("h3", { text: area.name }));
            page.append(h("div", { class: "grid" }, area.entities.map(motionCard)));
          }
        }
      }

      function isAlert(entity) {
        const state = live(entity).state;
        if (state === "unavailable" || state === "unknown") return true;
        if (entity.kind === "lock") return state === "unlocked" || state === "on";
        return ["on", "open"].includes(state);
      }

      function securityCard(entity) {
        const state = live(entity);
        const card = h("article", { class: isAlert(entity) ? "card alert" : "card" });
        card.append(h("h3", { text: entity.name }));
        card.append(h("p", { text: labelOf(state.state, entity.kind) }));
        return card;
      }

      function alarmCard(entity) {
        const state = live(entity);
        const features = Number(state.attributes.supported_features || 0);
        const card = h("article", { class: state.state === "triggered" ? "card alert" : "card" });
        card.append(h("h3", { text: entity.name }));
        card.append(h("p", { class: "value", text: labelOf(state.state) }));
        const row = h("div", { class: "row" });
        for (const [mode, text] of ALARM_MODES) {
          if (mode !== "disarm" && features && (features & ALARM_FEATURES[mode]) === 0) continue;
          const button = h("button", { class: "action", type: "button", text });
          button.addEventListener("click", () => openAlarm(entity, mode));
          row.append(button);
        }
        card.append(row);
        return card;
      }

      function cameraCard(entity) {
        const card = h("article", { class: "card" });
        card.append(h("h3", { text: entity.name }));
        const img = h("img", { class: "shot", alt: "", src: "/api/camera/" + encodeURIComponent(entity.entity_id) });
        img.addEventListener("error", () => img.replaceWith(h("p", { class: "muted", text: "Ingen bild" })));
        card.append(img);
        return card;
      }

      function renderSecurity(page) {
        page.append(h("h2", { text: "Säkerhet" }));
        const alarms = allEntities().filter((entity) => entity.kind === "alarm");
        if (alarms.length) page.append(h("div", { class: "grid" }, alarms.map(alarmCard)));
        for (const floor of grouped(["door", "window", "opening", "lock", "smoke", "moisture"])) {
          page.append(h("h2", { text: floor.name }));
          for (const area of floor.areas) {
            page.append(h("h3", { text: area.name }));
            page.append(h("div", { class: "grid" }, area.entities.map(securityCard)));
          }
        }
        const cameras = allEntities().filter((entity) => entity.kind === "camera");
        if (cameras.length) {
          page.append(h("h2", { text: "Kameror" }));
          page.append(h("div", { class: "grid" }, cameras.map(cameraCard)));
        }
      }

      function focusCard(id, title) {
        const entity = findEntity(id);
        if (!entity) return null;
        const state = live(entity);
        const unit = state.attributes.unit_of_measurement || "";
        return h("article", { class: "card" }, [
          h("h3", { text: title }),
          h("p", { class: "value", text: formatNumber(state.state, unit.includes("kWh") ? 2 : 1) }),
          h("p", { class: "muted", text: (unit ? unit + " · " : "") + entity.name }),
        ]);
      }

      async function drawPrice(host, entityId) {
        const hours = Math.max(1, new Date().getHours() + 1);
        const response = await fetch("/api/history?entity_id=" + encodeURIComponent(entityId) + "&hours=" + hours, { credentials: "same-origin" });
        const points = response.ok ? ((await response.json()).points || []) : [];
        if (points.length < 2) return;
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 300 80");
        svg.setAttribute("class", "chart");
        const min = Math.min(...points);
        const max = Math.max(...points);
        const span = max - min || 1;
        const step = 300 / (points.length - 1);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        line.setAttribute("fill", "none");
        line.setAttribute("stroke", "currentColor");
        line.setAttribute("stroke-width", "3");
        line.setAttribute("points", points.map((value, i) => (i * step).toFixed(1) + "," + (74 - ((value - min) / span) * 68).toFixed(1)).join(" "));
        svg.append(line);
        host.append(svg);
      }

      function renderEnergy(page) {
        page.append(h("h2", { text: "Energi" }));
        const summary = h("div", { class: "grid" });
        for (const card of [focusCard(home.focus?.power, "Effekt nu"), focusCard(home.focus?.energy, "Energi idag"), focusCard(home.focus?.price, "Elpris")]) {
          if (card) summary.append(card);
        }
        const price = summary.querySelectorAll(".card")[home.focus?.price ? summary.childNodes.length - 1 : -1];
        if (home.focus?.price && price) price.dataset.chart = "price";
        if (summary.childNodes.length) page.append(summary);
        const chargers = allEntities().filter((entity) => entity.kind === "charger");
        if (chargers.length) {
          page.append(h("h2", { text: "Laddbox" }));
          page.append(h("div", { class: "grid" }, chargers.map((entity) => {
            const state = live(entity);
            const unit = state.attributes.unit_of_measurement || "";
            return h("article", { class: "card" }, [
              h("h3", { text: entity.name }),
              h("p", { text: labelOf(state.state) + (unit ? " " + unit : "") }),
              h("p", { class: "muted", text: entity.device_name || "" }),
            ]);
          })));
        }
      }

      function renderMedia(page) {
        page.append(h("h2", { text: "Media" }));
        const active = allEntities().filter((entity) => entity.kind === "media" && ["playing", "paused", "buffering", "on"].includes(live(entity).state));
        page.append(h("div", { class: "grid" }, active.map((entity) => {
          const state = live(entity);
          const card = h("article", { class: "card" });
          card.append(h("h3", { text: entity.name }));
          card.append(h("p", { text: state.attributes.media_title || labelOf(state.state) }));
          if (state.attributes.media_artist) card.append(h("p", { class: "muted", text: state.attributes.media_artist }));
          const button = h("button", { class: "action", type: "button", text: state.state === "playing" ? "Paus" : "Spela" });
          button.addEventListener("click", () => act({ action: "media", entity_id: entity.entity_id, command: "play_pause" }));
          card.append(button);
          if (typeof state.attributes.volume_level === "number") {
            const input = document.createElement("input");
            input.type = "range";
            input.min = "0";
            input.max = "100";
            input.value = String(Math.round(state.attributes.volume_level * 100));
            input.addEventListener("change", () => act({ action: "media", entity_id: entity.entity_id, command: "volume", volume_level: Number(input.value) / 100 }));
            card.append(input);
          }
          return card;
        })));
      }

      function renderSystem(page) {
        page.append(h("h2", { text: "System" }));
        const low = allEntities().filter((entity) => {
          if (entity.kind !== "battery") return false;
          const value = Number(live(entity).state);
          return Number.isFinite(value) && value < 20;
        });
        page.append(h("h3", { text: "Svaga batterier" }));
        page.append(low.length ? h("div", { class: "grid" }, low.map((entity) => h("article", { class: "card alert" }, [
          h("h3", { text: entity.name }),
          h("p", { class: "value", text: formatNumber(live(entity).state, 0) + "%" }),
        ]))) : h("p", { class: "muted", text: "Inga batterier under 20 %." }));
        const updates = allEntities().filter((entity) => entity.kind === "update" && live(entity).state === "on");
        page.append(h("h3", { text: "Uppdateringar" }));
        page.append(updates.length ? h("div", { class: "grid" }, updates.map((entity) => {
          const state = live(entity);
          return h("article", { class: "card" }, [
            h("h3", { text: state.attributes.title || entity.name }),
            h("p", { class: "muted", text: (state.attributes.installed_version || "") + " → " + (state.attributes.latest_version || "") }),
          ]);
        })) : h("p", { class: "muted", text: "Inga väntande uppdateringar." }));
        page.append(h("h3", { text: "Otillgängliga" }));
        page.append(h("p", { class: "value", text: String(home.unavailable_count || 0) }));
        if (home.unavailable?.length) {
          page.append(h("div", { class: "grid" }, home.unavailable.map((entity) => h("article", { class: "card alert" }, [h("h3", { text: entity.name })]))));
        }
      }

      function renderFamily(page) {
        page.append(h("h2", { text: "Familj" }));
        const lunches = allEntities().filter((entity) => entity.kind === "lunch");
        if (lunches.length) {
          page.append(h("div", { class: "grid" }, lunches.map((entity) => h("article", { class: "card" }, [
            h("h3", { text: entity.name }),
            h("p", { text: live(entity).state }),
          ]))));
        }
        const calendars = allEntities().filter((entity) => entity.kind === "calendar");
        for (const entity of calendars) {
          page.append(h("h3", { text: entity.name }));
          const events = entity.events || [];
          if (!events.length) {
            page.append(h("p", { class: "muted", text: "Inga händelser de närmaste två dygnen." }));
            continue;
          }
          page.append(h("div", { class: "grid" }, events.map((event) => h("article", { class: "card" }, [
            h("h3", { text: event.summary || "Händelse" }),
            h("p", { class: "muted", text: String(event.start || "") }),
          ]))));
        }
      }

      const RENDER = { belysning: renderLights, klimat: renderClimate, narvaro: renderPresence, sakerhet: renderSecurity, energi: renderEnergy, media: renderMedia, system: renderSystem, familj: renderFamily };

      function renderTabs() {
        const nav = document.querySelector("#tabs");
        nav.replaceChildren(...(home.tabs || ["hem"]).map((id) => {
          const button = h("button", { type: "button", text: TABS[id] || id });
          button.setAttribute("aria-selected", id === tab ? "true" : "false");
          button.addEventListener("click", () => {
            tab = id;
            history.replaceState(null, "", "#" + id);
            renderTabs();
            render();
          });
          return button;
        }));
      }

      function render() {
        if (!home.tabs?.includes(tab)) tab = "hem";
        view.classList.toggle("hem", tab === "hem");
        if (tab === "hem") {
          ensureVilla();
          return;
        }
        const page = h("div", { class: "page" });
        RENDER[tab](page);
        view.replaceChildren(page);
        const chart = page.querySelector("[data-chart]");
        if (chart && home.focus?.price) drawPrice(chart, home.focus.price);
      }

      function openAlarm(entity, mode) {
        alarmTarget = { entity, mode };
        document.querySelector("#alarm-title").textContent = entity.name;
        document.querySelector("#alarm-code").hidden = !live(entity).attributes.code_arm_required;
        document.querySelector("#alarm-status").textContent = "";
        document.querySelector("#alarm-pin").value = "";
        document.querySelector("#modal").hidden = false;
      }

      function connect() {
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(protocol + "://" + location.host + "/api/live");
        socket.onmessage = (event) => {
          const message = JSON.parse(event.data);
          if (message.type === "snapshot") states = message.states || {};
          if (message.type === "state") states[message.entity_id] = message.state;
          seedStates();
          if (tab === "hem" && svgRoot) {
            apply(svgRoot);
            if (message.type === "snapshot") drawSparks(svgRoot);
            return;
          }
          const active = document.activeElement;
          if (active && view.contains(active) && active.matches("input")) return;
          render();
        };
        socket.onclose = () => setTimeout(connect, 2000);
      }

      async function show() {
        gate.hidden = true;
        app.hidden = false;
        const [homeResponse, designResponse] = await Promise.all([
          fetch("/api/home", { credentials: "same-origin" }),
          fetch("/api/design", { credentials: "same-origin" }),
        ]);
        home = await homeResponse.json();
        designSvg = (await designResponse.json()).svg || "";
        seedStates();
        const hash = location.hash.slice(1);
        if (home.tabs?.includes(hash)) tab = hash;
        renderTabs();
        render();
        connect();
        setInterval(() => { if (tab === "hem" && svgRoot) apply(svgRoot); }, 1000);
        setInterval(async () => {
          const response = await fetch("/api/home", { credentials: "same-origin" });
          if (!response.ok) return;
          home = await response.json();
          seedStates();
          renderTabs();
          if (tab !== "hem") render();
        }, 120000);
      }

      document.querySelector("#pin-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: document.querySelector("#pin").value.trim() }),
        });
        document.querySelector("#pin-status").textContent = response.ok ? "" : "Fel pinkod";
        if (response.ok) show();
      });
      document.querySelector("#alarm-cancel").addEventListener("click", () => { document.querySelector("#modal").hidden = true; });
      document.querySelector("#alarm-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!alarmTarget) return;
        const ok = await act({
          action: "alarm",
          entity_id: alarmTarget.entity.entity_id,
          mode: alarmTarget.mode,
          pin: document.querySelector("#alarm-pin").value,
          code: document.querySelector("#alarm-code").value,
        });
        document.querySelector("#alarm-status").textContent = ok ? "" : "Pinkoden stämmer inte";
        if (ok) document.querySelector("#modal").hidden = true;
      });

      async function boot() {
        const response = await fetch("/api/session", { credentials: "same-origin" });
        if (response.status === 401) {
          gate.hidden = false;
          app.hidden = true;
          return;
        }
        show();
      }
      boot();
    </script>
  </body>
</html>
